
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>EMI Calculator</h1>
        <p class="subtitle">Calculate your monthly loan payments</p>

        <div class="calculator">
            <div class="input-group">
                <label for="loanAmount">Loan Amount (₹)</label>
                <input
                    type="number"
                    id="loanAmount"
                    placeholder="Enter loan amount"
                    min="1"
                    step="any"
                >
            </div>

            <div class="input-group">
                <label for="interestRate">Annual Interest Rate (%)</label>
                <input
                    type="number"
                    id="interestRate"
                    placeholder="Enter interest rate"
                    min="0"
                    step="any"
                >
            </div>

            <div class="input-group">
                <label for="loanTenure">Loan Tenure (Years)</label>
                <input
                    type="number"
                    id="loanTenure"
                    placeholder="Enter tenure in years"
                    min="0.01"
                    step="any"
                >
            </div>

            <p id="errorMessage" class="error" role="alert"></p>

            <button type="button" id="calculateBtn">
                Calculate EMI
            </button>

            <button type="button" id="resetBtn" class="reset-btn">
                Reset
            </button>
        </div>

        <div class="results" aria-live="polite">
            <h2>Repayment Summary</h2>

            <div class="result-card">
                <p>Monthly EMI</p>
                <h3 id="monthlyEMI">₹0.00</h3>
            </div>

            <div class="result-card">
                <p>Total Interest Payable</p>
                <h3 id="totalInterest">₹0.00</h3>
            </div>

            <div class="result-card">
                <p>Total Repayment</p>
                <h3 id="totalPayment">₹0.00</h3>
            </div>
        </div>
    </div>

</body>
</html>
